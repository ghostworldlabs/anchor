<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body{margin:0;font:14px/1.5 Segoe UI,sans-serif;color:#1e293b;background:#fff;padding:26px}
  .row{display:flex;align-items:center;gap:22px;margin-bottom:24px;flex-wrap:wrap}
  .big{width:140px;height:140px;border-radius:26px}
  .card{display:flex;align-items:center;gap:9px;border:1px solid #e2e8f0;border-radius:10px;padding:8px 12px;background:#fff}
  .card.dark{background:#0f172a;color:#f8fafc;border-color:#0f172a}
  .card img{border-radius:6px}
  .lbl{font-size:12px;color:#64748b}
  h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#475569}
</style></head><body>
  <h3>Big (256px source)</h3>
  <div class="row">
    <img class="big" src="../../../vendor/brand/gandalf-white-icon.svg" alt="Gandalf the White">
    <span class="lbl">Gandalf the White — white hat / beard / staff + soft white aura on slate. No green.</span>
  </div>
  <h3>At the size it actually appears in the tab header</h3>
  <div class="row">
    <div class="card"><img src="../../../vendor/brand/gandalf-white-icon.svg" width="26" height="26"><b>Gandalf</b></div>
    <div class="card"><img src="../../../vendor/brand/gandalf-white-icon.svg" width="20" height="20"><span class="lbl">20px</span></div>
    <div class="card dark"><img src="../../../vendor/brand/gandalf-white-icon.svg" width="26" height="26"><b>Gandalf</b></div>
    <div class="card"><img src="../../../vendor/brand/gandalf-white-icon.svg" width="16" height="16"><span class="lbl">16px favicon size</span></div>
  </div>
</body></html>
