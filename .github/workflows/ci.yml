name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install .[dev,terminal]
      - name: Run Node Test Suite
        run: node --test "test/**/*.mjs" "test/**/*.js"
      - name: Run Python Test Suite
        run: pytest
      - name: Lockfile Lint
        run: node tools/lint_lockfile.mjs
      - name: Doc Consistency Check
        run: node tools/doc_consistency.mjs
      - name: Build Bundle (Deny-by-Default)
        run: node tools/build_bundle.mjs
      - name: Leak Scan
        run: node tools/leak_scan.mjs
      - name: Pure-JS Install (Acceptance)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            echo "No package-lock.json found. Skipping npm ci."
          fi
        working-directory: bundle_staging
      - name: Staged Bundle Boot Smoke
        shell: bash
        run: |
          mkdir -p ../foreign_root
          cp -r bundle_staging ../foreign_root/bundle
          cd ../foreign_root/bundle
          python -c "import anchor_gui; server = anchor_gui.make_server('127.0.0.1', 0); server.server_close(); print('Engine started successfully')"
          node tools/smoke_integration.mjs

  no-green-no-bundle:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All tests and Wave 9 gates passed. Bundle is allowed."
