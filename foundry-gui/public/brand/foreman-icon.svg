<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    @media (prefers-reduced-motion:no-preference){
      .blink{animation:blink 4s ease-in-out infinite}
      @keyframes blink{0%,60%,100%{opacity:.35}70%,90%{opacity:1}}
      .pulseNode{animation:pn 4s ease-in-out infinite}
      @keyframes pn{0%,100%{opacity:.55}50%{opacity:1}}
    }
  </style>
  <defs>
    <radialGradient id="bgCool" cx="50%" cy="44%" r="72%"><stop offset="0%" stop-color="#122029"/><stop offset="60%" stop-color="#0a0f15"/><stop offset="100%" stop-color="#060709"/></radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#0090b8"/></linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bgCool)"/>
  <circle cx="52" cy="68" r="26" fill="url(#glowC)" opacity="0.10"/>
  <g fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round">
    <path d="M36 82 L50 56"/><path d="M58 54 L70 78"/><path d="M66 84 L40 84"/>
  </g>
  <g fill="#00f0ff">
    <path d="M45 66 l5 -2 -1 5 z"/><path d="M64 66 l1 5 4 -3 z"/><path d="M52 84 l-5 -3 0 6 z"/>
  </g>
  <circle cx="36" cy="84" r="4" fill="#00f0ff" class="pulseNode"/>
  <circle cx="53" cy="52" r="4" fill="#ffb020" class="pulseNode"/>
  <circle cx="68" cy="84" r="4" fill="#00ff66" class="pulseNode"/>
  <circle r="3" fill="#eafbff"><animateMotion dur="4s" repeatCount="indefinite" path="M36 84 L50 56 L70 78 L40 84 Z"/></circle>
  <path d="M68 84 L82 84" stroke="#00f0ff" stroke-width="2" opacity="0.7"/>
  <rect x="82" y="80" width="18" height="9" rx="1.5" fill="url(#steel)"/>
  <rect x="84" y="69" width="14" height="9" rx="1.5" fill="url(#steel)"/>
  <rect x="86" y="58" width="10" height="9" rx="1.5" fill="none" stroke="#00f0ff" stroke-width="1.4" stroke-dasharray="3 2" opacity="0.6" class="blink"/>
  <g stroke="#eafbff" stroke-width="0.9" opacity="0.6"><path d="M82 80 h18"/><path d="M84 69 h14"/></g>
  <path d="M80 90 L102 90" stroke="#2a3340" stroke-width="1.5" stroke-linecap="round"/>
</svg>
