<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    @media (prefers-reduced-motion:no-preference){
      .breathe{animation:breathe 3.4s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.28}50%{opacity:.6}}
      .vein{stroke-dasharray:34 90;animation:vein 7s linear infinite}
      @keyframes vein{to{stroke-dashoffset:-124}}
      .twinkle{animation:twk 3s ease-in-out infinite}
      @keyframes twk{0%,100%{opacity:.9}50%{opacity:1}}
      .rays{animation:rays 3s ease-in-out infinite;transform-origin:63px 64px}
      @keyframes rays{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
    }
  </style>
  <defs>
    <radialGradient id="bgWarm" cx="50%" cy="56%" r="72%"><stop offset="0%" stop-color="#241708"/><stop offset="60%" stop-color="#140d06"/><stop offset="100%" stop-color="#070604"/></radialGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffb020"/><stop offset="100%" stop-color="#ffb020" stop-opacity="0"/></radialGradient>
    <linearGradient id="molten" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff6b00"/><stop offset="55%" stop-color="#ffb020"/><stop offset="100%" stop-color="#ffe6a8"/></linearGradient>
    <radialGradient id="whiteGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#fff4d2" stop-opacity="0.75"/><stop offset="100%" stop-color="#ffe6a8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bgWarm)"/>
  <ellipse cx="63" cy="70" rx="40" ry="34" fill="url(#glowA)" opacity="0.16" class="breathe"/>
  <path d="M64 26 L97 45 L97 83 L64 102 L31 83 L31 45 Z" fill="#0d0b08" stroke="#3a2e18" stroke-width="2"/>
  <path d="M31 45 L64 26" stroke="#00f0ff" stroke-width="1.5" opacity="0.55"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 27 L60 48 L52 66 L64 86" stroke="#ffb020" stroke-width="7" opacity="0.30" class="breathe"/>
    <path d="M96 57 L74 62 L63 66 L84 95" stroke="#ffb020" stroke-width="7" opacity="0.30" class="breathe"/>
    <path d="M55 27 L60 48 L52 66 L64 86" stroke="url(#molten)" stroke-width="3.4"/>
    <path d="M96 57 L74 62 L63 66 L84 95" stroke="url(#molten)" stroke-width="3.4"/>
    <path d="M55 27 L60 48 L52 66 L64 86" stroke="#ffe6a8" stroke-width="2" class="vein"/>
    <path d="M96 57 L74 62 L63 66 L84 95" stroke="#ffe6a8" stroke-width="2" class="vein"/>
  </g>
  <!-- white-hot multi-ray light source at the fracture crossing -->
  <g class="twinkle">
    <circle cx="63" cy="64" r="17" fill="url(#whiteGlow)"/>
    <g class="rays" stroke="#fff8ea" stroke-linecap="round">
      <line x1="63" y1="37" x2="63" y2="91" stroke-width="1.1"/>
      <line x1="36" y1="64" x2="90" y2="64" stroke-width="1.1"/>
      <line x1="51" y1="52" x2="75" y2="76" stroke-width="0.7" opacity="0.85"/>
      <line x1="75" y1="52" x2="51" y2="76" stroke-width="0.7" opacity="0.85"/>
      <line x1="56" y1="45" x2="70" y2="83" stroke-width="0.55" opacity="0.65"/>
      <line x1="70" y1="45" x2="56" y2="83" stroke-width="0.55" opacity="0.65"/>
      <line x1="47" y1="57" x2="79" y2="71" stroke-width="0.55" opacity="0.65"/>
      <line x1="79" y1="57" x2="47" y2="71" stroke-width="0.55" opacity="0.65"/>
    </g>
    <circle cx="63" cy="64" r="3.4" fill="#ffffff"/>
    <circle cx="63" cy="64" r="1.6" fill="#ffffff"/>
  </g>
</svg>
