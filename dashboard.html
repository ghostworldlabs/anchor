<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anchor Dashboard — J.C. Liechty</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3340;
    --text: #e2e4e9;
    --text-dim: #8b8f9a;
    --accent: #6c9cfc;
    --academic: #6c9cfc;
    --writing: #c084fc;
    --family: #4ade80;
    --commercial: #fb923c;
    --personal: #67e8f9;
    --danger: #f87171;
    --warning: #fbbf24;
    --success: #4ade80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Layout */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    overflow-y: auto;
  }

  .sidebar h1 {
    font-size: 20px;
    padding: 0 20px 4px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .sidebar h1 span { color: var(--accent); }
  .sidebar .subtitle { font-size: 11px; color: var(--text-dim); padding: 0 20px 20px; }

  .nav-section { margin-top: 16px; }
  .nav-section h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-dim);
    padding: 0 20px 6px;
  }

  .nav-item {
    padding: 8px 20px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--surface2); }
  .nav-item.active { background: var(--surface2); border-left-color: var(--accent); }
  .nav-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .nav-item .count {
    margin-left: auto;
    background: var(--surface2);
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* Balance widget */
  .balance-widget {
    margin: auto 16px 16px;
    padding: 14px;
    background: var(--surface2);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .balance-widget h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 10px; }
  .balance-bars { display: flex; flex-direction: column; gap: 6px; }
  .balance-row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .balance-row .label { width: 60px; color: var(--text-dim); }
  .balance-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .balance-bar .fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

  /* Main content */
  .main {
    margin-left: 260px;
    flex: 1;
    padding: 28px 32px;
    max-width: 1100px;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-header h2 { font-size: 22px; font-weight: 600; }
  .page-header .date { color: var(--text-dim); font-size: 13px; }

  /* Cards — compact row style */
  .card-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    transition: border-color 0.2s;
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .card:hover { border-color: #3e4455; }
  .card.priority-1 { border-left: 3px solid var(--danger); }
  .card.priority-2 { border-left: 3px solid var(--warning); }
  .card.priority-3 { border-left: 3px solid var(--accent); }
  .card.priority-5 { border-left: 3px solid var(--text-dim); }
  .card.has-deadline { background: linear-gradient(90deg, rgba(248,113,113,0.06), transparent 40%); }

  .card-main { flex: 1; min-width: 0; }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .card h3 { font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .due-badge {
    font-size: 10px;
    background: rgba(248,113,113,0.2);
    color: var(--danger);
    padding: 1px 7px;
    border-radius: 3px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card .effort-badge {
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 3px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .effort-badge.low { background: rgba(74,222,128,0.15); color: var(--success); }
  .effort-badge.med { background: rgba(251,191,36,0.12); color: var(--warning); }
  .effort-badge.high { background: rgba(192,132,252,0.12); color: var(--writing); }
  .card .next-text { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .card .domain-tag {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .domain-tag.academic { background: rgba(108,156,252,0.15); color: var(--academic); }
  .domain-tag.writing { background: rgba(192,132,252,0.15); color: var(--writing); }
  .domain-tag.family { background: rgba(74,222,128,0.15); color: var(--family); }
  .domain-tag.commercial { background: rgba(251,146,60,0.15); color: var(--commercial); }
  .domain-tag.personal { background: rgba(103,232,249,0.15); color: var(--personal); }

  .card .status { display: none; }
  .card .collaborators { display: none; }
  .card .card-actions {
    display: flex;
    gap: 3px;
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .card:hover .card-actions { opacity: 1; }
  .card-actions button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 24px;
    height: 24px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .card-actions button:hover { background: var(--border); color: var(--text); }
  .card-actions button.delete:hover { background: rgba(248,113,113,0.2); color: var(--danger); }

  /* Expanded card for detail view (domain pages) */
  .card-grid.expanded .card { flex-direction: column; align-items: stretch; padding: 14px; }
  .card-grid.expanded .card-main { width: 100%; }
  .card-grid.expanded .card h3 { white-space: normal; }
  .card-grid.expanded .card .next-text { white-space: normal; }
  .card-grid.expanded .card .collaborators { display: block; font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .card-grid.expanded .card .card-actions { position: absolute; top: 10px; right: 10px; }

  /* Tasks / Checklist */
  .task-list { margin-bottom: 24px; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-header h3 { font-size: 15px; font-weight: 600; }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    transition: all 0.15s;
    cursor: default;
  }
  .task-item:hover { border-color: #3e4455; }
  .task-item.completed { opacity: 0.5; }
  .task-item.completed .task-text { text-decoration: line-through; }

  .task-check {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check.checked { background: var(--accent); border-color: var(--accent); }
  .task-check.checked::after { content: '✓'; color: white; font-size: 11px; font-weight: 700; }

  .task-text { font-size: 13px; flex: 1; }
  .task-meta { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .task-priority {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 600;
  }
  .task-priority.p1 { background: rgba(248,113,113,0.15); color: var(--danger); }
  .task-priority.p2 { background: rgba(251,191,36,0.15); color: var(--warning); }
  .task-priority.p3 { background: rgba(108,156,252,0.15); color: var(--accent); }
  .task-energy { font-size: 10px; color: var(--text-dim); }

  .task-delete {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    opacity: 0;
    transition: all 0.15s;
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { color: var(--danger); }

  /* Inbox */
  .inbox-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .inbox-input-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .inbox-input-row input:focus { border-color: var(--accent); }
  .inbox-input-row input::placeholder { color: var(--text-dim); }

  .inbox-input-row select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-outline:hover { background: var(--surface2); opacity: 1; }

  /* Top Tasks focus box */
  .top-tasks-box {
    background: var(--surface);
    border: 1px solid rgba(108,156,252,0.3);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 20px;
  }
  .top-tasks-box .top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .top-tasks-box h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
  }
  .top-tasks-box .top-progress {
    font-size: 11px;
    color: var(--text-dim);
  }
  .top-task-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    transition: opacity 0.3s;
  }
  .top-task-row:last-child { border-bottom: none; }
  .top-task-row.done { opacity: 0.4; }
  .top-task-row.done .top-task-text { text-decoration: line-through; }
  .top-task-done-btn {
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
  }
  .top-task-done-btn:hover { background: var(--success); color: #000; border-color: var(--success); }
  .top-task-done-btn.checked {
    background: var(--success);
    color: #000;
    border-color: var(--success);
  }
  .top-task-text { font-size: 13px; flex: 1; font-weight: 500; }
  .top-task-due {
    font-size: 10px;
    background: rgba(248,113,113,0.2);
    color: var(--danger);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    white-space: nowrap;
  }
  .top-task-effort {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .top-task-effort.low { background: rgba(74,222,128,0.15); color: var(--success); }
  .top-task-effort.med { background: rgba(251,191,36,0.12); color: var(--warning); }
  .top-task-effort.high { background: rgba(192,132,252,0.12); color: var(--writing); }
  .top-task-domain {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 3px;
  }

  /* Stats row */
  .stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    flex: 1;
    text-align: center;
  }
  .stat-card .num { font-size: 20px; font-weight: 700; }
  .stat-card .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 480px;
    max-width: 90vw;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 16px; margin-bottom: 16px; }
  .modal label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal select, .modal textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  .modal textarea { resize: vertical; min-height: 60px; }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* Export area */
  .export-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-top: 24px;
  }
  .export-area pre {
    background: var(--surface2);
    padding: 12px;
    border-radius: 6px;
    font-size: 12px;
    overflow-x: auto;
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: var(--text-dim);
    display: none;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 16px; }
    .card-grid { grid-template-columns: 1fr; }
    .stats-row { flex-wrap: wrap; }
    .stat-card { min-width: calc(50% - 6px); }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <nav class="sidebar">
    <h1><span>&#9875;</span> Anchor</h1>
    <div class="subtitle">J.C. Liechty — Life Dashboard</div>

    <div class="nav-section">
      <h3>Views</h3>
      <div class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')">
        <span class="dot" style="background:var(--accent)"></span> Dashboard
      </div>
      <div class="nav-item" data-view="inbox" onclick="switchView('inbox')">
        <span class="dot" style="background:var(--warning)"></span> Inbox <span class="count" id="inbox-count">0</span>
      </div>
    </div>

    <div class="nav-section">
      <h3>Domains</h3>
      <div class="nav-item" data-view="academic" onclick="switchView('academic')">
        <span class="dot" style="background:var(--academic)"></span> Academic <span class="count" id="academic-count">0</span>
      </div>
      <div class="nav-item" data-view="writing" onclick="switchView('writing')">
        <span class="dot" style="background:var(--writing)"></span> Writing <span class="count" id="writing-count">0</span>
      </div>
      <div class="nav-item" data-view="family" onclick="switchView('family')">
        <span class="dot" style="background:var(--family)"></span> Family & Personal <span class="count" id="family-count">0</span>
      </div>
      <div class="nav-item" data-view="commercial" onclick="switchView('commercial')">
        <span class="dot" style="background:var(--commercial)"></span> Commercial <span class="count" id="commercial-count">0</span>
      </div>
      <div class="nav-item" data-view="personal" onclick="switchView('personal')">
        <span class="dot" style="background:var(--personal)"></span> Systems & Meta <span class="count" id="personal-count">0</span>
      </div>
    </div>

    <div class="nav-section">
      <h3>Tools</h3>
      <div class="nav-item" onclick="exportMarkdown()">
        <span class="dot" style="background:var(--text-dim)"></span> Export to Markdown
      </div>
    </div>

    <div class="balance-widget" id="balance-widget">
      <h4>Balance Check</h4>
      <div class="balance-bars" id="balance-bars"></div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main" id="main-content"></main>
</div>

<!-- Add/Edit Project Modal -->
<div class="modal-overlay" id="project-modal">
  <div class="modal">
    <h3 id="modal-title">Add Project</h3>
    <input type="hidden" id="edit-project-id">
    <label>Project Name</label>
    <input type="text" id="proj-name" placeholder="e.g., Bayesian ANOVA Paper">
    <label>Domain</label>
    <select id="proj-domain">
      <option value="academic">Academic</option>
      <option value="writing">Writing</option>
      <option value="family">Family & Personal</option>
      <option value="commercial">Commercial</option>
      <option value="personal">Systems & Meta</option>
    </select>
    <label>Priority (1 = highest)</label>
    <select id="proj-priority">
      <option value="1">1 — Critical</option>
      <option value="2">2 — Important</option>
      <option value="3" selected>3 — Normal</option>
      <option value="4">4 — Low</option>
      <option value="5">5 — Someday</option>
    </select>
    <label>Status</label>
    <select id="proj-status">
      <option value="active">Active</option>
      <option value="paused">Paused</option>
      <option value="blocked">Blocked</option>
      <option value="winding down">Winding Down</option>
      <option value="completed">Completed</option>
    </select>
    <label>Next Step</label>
    <textarea id="proj-next" placeholder="The one concrete next action..."></textarea>
    <label>Effort Level</label>
    <select id="proj-effort">
      <option value="low">Low (quick action / email)</option>
      <option value="med">Medium</option>
      <option value="high" selected>High (deep work)</option>
    </select>
    <label>Due Date (optional)</label>
    <input type="date" id="proj-due">
    <label>Collaborators</label>
    <input type="text" id="proj-collabs" placeholder="e.g., Keith Cheng (Penn State), Thang Luong (DeepMind)">
    <label>Notes</label>
    <textarea id="proj-notes" placeholder="Additional context..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveProject()">Save</button>
    </div>
  </div>
</div>

<!-- Add Task Modal -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <h3>Add Task</h3>
    <label>Task</label>
    <input type="text" id="task-text" placeholder="What needs to be done?">
    <label>Domain</label>
    <select id="task-domain">
      <option value="academic">Academic</option>
      <option value="writing">Writing</option>
      <option value="family">Family & Personal</option>
      <option value="commercial">Commercial</option>
      <option value="personal">Systems & Meta</option>
    </select>
    <label>Priority</label>
    <select id="task-priority">
      <option value="1">1 — Critical</option>
      <option value="2" selected>2 — Important</option>
      <option value="3">3 — Normal</option>
    </select>
    <label>Energy Required</label>
    <select id="task-energy">
      <option value="high">High (deep thinking)</option>
      <option value="med" selected>Medium</option>
      <option value="low">Low (admin/routine)</option>
    </select>
    <label>Due Date (optional)</label>
    <input type="date" id="task-due">
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeTaskModal()">Cancel</button>
      <button class="btn" onclick="saveTask()">Add Task</button>
    </div>
  </div>
</div>

<script>
// ============ UI STATE ============
let showingCompleted = false;


// ============ DATA ============
const STATE = {
  projects: [
    {
      id: 1, name: "ML/DNN for Conjoint Analysis (Paper 1: MoE Repositioning)", domain: "academic", priority: 2,
      status: "active", effort: "high", due: "TBD",
      next: "Reposition MoE paper from JM special issue to Journal of Marketing Science", collabs: "Two junior Marketing faculty, Penn State", notes: "Extended MoE outperforms traditional DNN and HB finite mixture. Uses In4mation Insights conjoint data."
    },
    {

  const main = document.getElementById('main-content');

  updateCounts();

function getTopTasks() {
  // Build a sorted list of the most important actionable items
  // 1) Tasks with due dates (soonest first)
  // 2) P1 tasks that are low effort (quick wins)
  // 3) P1 tasks that are high effort (deep work)
  const p1 = STATE.tasks.filter(t => t.priority === 1);
  const withDue = p1.filter(t => t.due).sort((a, b) => a.due.localeCompare(b.due));
  const lowEffort = p1.filter(t => !t.due && t.energy === 'low');
  const medEffort = p1.filter(t => !t.due && t.energy === 'med');
  const highEffort = p1.filter(t => !t.due && t.energy === 'high');
  // Dedupe
  const seen = new Set();
  const result = [];
  for (const t of [...withDue, ...lowEffort, ...medEffort, ...highEffort]) {
    if (!seen.has(t.id)) { seen.add(t.id); result.push(t); }
  }
  return result;
}

function getProjectSortScore(p) {
  // Lower score = higher in list
  // 1) Has a due date with a real deadline → top (sorted by date proximity)
  // 2) Low effort (quick wins) → next
  // 3) Everything else by priority then name
  const effort = p.effort || 'high';
  const hasDue = p.due && p.due.length > 0;
  if (hasDue) {
    const daysUntil = Math.floor((new Date(p.due) - new Date()) / 86400000);
    return -1000 + daysUntil; // deadlines first, closest first
  }
  if (effort === 'low') return 0;
  if (effort === 'med') return 100;
  return 200 + p.priority;
}

function sortProjects(projects) {
  return [...projects].sort((a, b) => getProjectSortScore(a) - getProjectSortScore(b));
}

  const effort = p.effort || 'high';

}

function deleteTask(id) {

}

  STATE.inbox.push({
    id: STATE.nextId.inbox++,
    text, date: new Date().toISOString().slice(0, 10), domain
  });
  input.value = '';
  rerender();
}

function deleteInbox(id) {
  const item = STATE.inbox.find(i => i.id === id);
  STATE.inbox = STATE.inbox.filter(i => i.id !== id);
  rerender();
}

function promoteInbox(id) {
  const item = STATE.inbox.find(i => i.id === id);
  if (!item) return;
  STATE.tasks.push({
    id: STATE.nextId.tasks++,
    text: item.text, domain: item.domain || 'personal',
    priority: 2, energy: 'med', due: '', done: false
  });
  STATE.inbox = STATE.inbox.filter(i => i.id !== id);
  rerender();
}

function openProjectModal(domain) {
  document.getElementById('modal-title').textContent = 'Add Project';
  document.getElementById('edit-project-id').value = '';
  document.getElementById('proj-name').value = '';
  document.getElementById('proj-domain').value = domain || 'academic';
  document.getElementById('proj-priority').value = '3';
  document.getElementById('proj-status').value = 'active';
  document.getElementById('proj-effort').value = 'high';
  document.getElementById('proj-due').value = '';
  document.getElementById('proj-next').value = '';
  document.getElementById('proj-collabs').value = '';
  document.getElementById('proj-notes').value = '';
  document.getElementById('project-modal').classList.add('open');
}

function editProject(id) {
  const p = STATE.projects.find(p => p.id === id);
  if (!p) return;
  document.getElementById('modal-title').textContent = 'Edit Project';
  document.getElementById('edit-project-id').value = id;
  document.getElementById('proj-name').value = p.name;
  document.getElementById('proj-domain').value = p.domain;
  document.getElementById('proj-priority').value = p.priority;
  document.getElementById('proj-status').value = p.status;
  document.getElementById('proj-effort').value = p.effort || 'high';
  document.getElementById('proj-due').value = p.due || '';
  document.getElementById('proj-next').value = p.next || '';
  document.getElementById('proj-collabs').value = p.collabs || '';
  document.getElementById('proj-notes').value = p.notes || '';
  document.getElementById('project-modal').classList.add('open');
}

function saveProject() {
  const editId = document.getElementById('edit-project-id').value;
  const data = {
    name: document.getElementById('proj-name').value.trim(),
    domain: document.getElementById('proj-domain').value,
    priority: parseInt(document.getElementById('proj-priority').value),
    status: document.getElementById('proj-status').value,
    effort: document.getElementById('proj-effort').value,
    due: document.getElementById('proj-due').value,
    next: document.getElementById('proj-next').value.trim(),
    collabs: document.getElementById('proj-collabs').value.trim(),
    notes: document.getElementById('proj-notes').value.trim()
  };
  if (!data.name) return;

  if (editId) {
    const p = STATE.projects.find(p => p.id === parseInt(editId));
    if (p) Object.assign(p, data);
  } else {
    STATE.projects.push({ id: STATE.nextId.projects++, ...data });
  }
  closeModal();
  rerender();
}

function closeModal() { document.getElementById('project-modal').classList.remove('open'); }

function openTaskModal(domain) {
  document.getElementById('task-text').value = '';
  document.getElementById('task-domain').value = domain || 'academic';
  document.getElementById('task-priority').value = '2';
  document.getElementById('task-energy').value = 'med';
  document.getElementById('task-due').value = '';
  document.getElementById('task-modal').classList.add('open');
}

function saveTask() {
  const text = document.getElementById('task-text').value.trim();
  if (!text) return;
  const domain = document.getElementById('task-domain').value;
  const priority = parseInt(document.getElementById('task-priority').value);
  STATE.tasks.push({
    id: STATE.nextId.tasks++,
    text, domain, priority,
    energy: document.getElementById('task-energy').value,
    due: document.getElementById('task-due').value,
    done: false
  });
  closeTaskModal();
  rerender();
}

function closeTaskModal() { document.getElementById('task-modal').classList.remove('open'); }

// ============ BALANCE ============

function renderBalance() {
  const domains = ['academic', 'writing', 'family', 'commercial'];
  const colors = { academic: 'var(--academic)', writing: 'var(--writing)', family: 'var(--family)', commercial: 'var(--commercial)' };
  const labels = { academic: 'Research', writing: 'Writing', family: 'Family', commercial: 'Business' };
  const container = document.getElementById('balance-bars');

  const activeCounts = {};
  domains.forEach(d => {
    activeCounts[d] = STATE.tasks.filter(t => t.domain === d && !t.done).length +
                      STATE.projects.filter(p => p.domain === d && p.status === 'active').length;
  });
  const max = Math.max(...Object.values(activeCounts), 1);

  container.innerHTML = domains.map(d => `
    <div class="balance-row">
      <span class="label">${labels[d]}</span>
      <div class="balance-bar">
        <div class="fill" style="width:${(activeCounts[d] / max) * 100}%;background:${colors[d]}"></div>
      </div>
      <span style="font-size:10px;color:var(--text-dim);width:16px;text-align:right">${activeCounts[d]}</span>
    </div>
  `).join('');
}

function updateCounts() {
  const count = (d) => STATE.projects.filter(p => p.domain === d).length + STATE.tasks.filter(t => t.domain === d && !t.done).length;
  ['academic', 'writing', 'family', 'commercial', 'personal'].forEach(d => {
    const el = document.getElementById(d + '-count');
    if (el) el.textContent = count(d);
  });
  document.getElementById('inbox-count').textContent = STATE.inbox.length;
}

// ============ EXPORT ============

function exportMarkdown() {
  let md = `# Anchor Dashboard Export\n*Exported: ${new Date().toLocaleString()}*\n\n`;
  md += `## Projects\n\n`;
  STATE.projects.forEach(p => {
    md += `### ${p.name}\n`;
    md += `- **Domain:** ${p.domain}\n- **Priority:** ${p.priority}\n- **Status:** ${p.status}\n`;
    if (p.next) md += `- **Next step:** ${p.next}\n`;
    if (p.collabs) md += `- **Collaborators:** ${p.collabs}\n`;
    if (p.notes) md += `- **Notes:** ${p.notes}\n`;
    md += `\n`;
  });
  md += `## Tasks\n\n`;
  STATE.tasks.forEach(t => {
    md += `- [${t.done ? 'x' : ' '}] ${t.text} \u2014 [${t.domain}] P${t.priority} ${t.energy}\n`;
  });
  md += `\n## Inbox\n\n`;
  STATE.inbox.forEach(i => {
    md += `- ${i.date}: ${i.text}${i.domain ? ' [' + i.domain + ']' : ''}\n`;
  });

  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'anchor-export-' + new Date().toISOString().slice(0, 10) + '.md';
  a.click();
}

function toggleExport() {
  const pre = document.getElementById('export-content');
  if (pre.style.display === 'block') {
    pre.style.display = 'none';
    return;
  }
  let md = '';
  STATE.projects.forEach(p => {
    md += `## ${p.name}\n- Domain: ${p.domain} | Priority: ${p.priority} | Status: ${p.status}\n`;
    if (p.next) md += `- Next: ${p.next}\n`;
    md += '\n';
  });
  md += '---\nTasks:\n';
  STATE.tasks.forEach(t => {
    md += `- [${t.done ? 'x' : ' '}] ${t.text} (${t.domain}, P${t.priority})\n`;
  });
  pre.textContent = md;
  pre.style.display = 'block';
}

// ============ INIT ============

function rerender() {
  const active = document.querySelector('.nav-item.active');
  const view = active ? active.getAttribute('data-view') : 'dashboard';
  renderView(view);
}

// Start
switchView('dashboard');
