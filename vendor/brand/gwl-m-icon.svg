<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Dark slate background with rounded corners -->
  <rect width="100" height="100" fill="#0f172a" rx="20"/>
  
  <!-- Glowing aura behind ghost -->
  <circle cx="50" cy="45" r="25" fill="#22c55e" opacity="0.3" filter="blur(5px)"/>
  
  <!-- Cute Ghost -->
  <path d="M30 70 V45 C30 30 70 30 70 45 V70 L63 60 L56 70 L50 60 L44 70 L37 60 Z" fill="#f8fafc"/>
  
  <!-- Eyes -->
  <circle cx="43" cy="42" r="4" fill="#0f172a"/>
  <circle cx="57" cy="42" r="4" fill="#0f172a"/>
  
  <!-- Radioactive / NextGen symbol on ghost's chest -->
  <text x="50" y="55" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22c55e" text-anchor="middle">☢</text>

  <!-- GWL-M Text -->
  <text x="50" y="88" font-family="monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">GWL-M</text>
