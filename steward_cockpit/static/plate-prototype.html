<!doctype html>
<html><head>
<meta charset="utf-8">
<title>Work product — prototype plate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/steward-static/shared.css">
<style>
  body { margin: 0; background: var(--bg, #0e1218); color: var(--text, #e8ecf4); }
  .proto { max-width: 1080px; margin: 0 auto; padding: 28px 22px 60px; }
  .proto h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .lead { color: var(--dim, #8b93a7); font-size: 14px; max-width: 46em; margin: 0 0 20px; }
</style>
</head>
<body data-theme="slate">
<div class="proto">
  <div class="wpeyebrow">Prototype</div>
  <h1 data-wptitle>Collapse of Marketing</h1>
  <p class="lead">This is a map of the paper — its parts and how they fit — not the to-do list of writing it. Hollow boxes are reserved holes. Click a part.</p>
  <div class="wpatlas" data-wpatlas></div>
  <div class="wpflow" data-wpbody></div>
  <p class="wphint">Same picture lives on the AI cockpit: open Collapse of Marketing, then the Work product bar at the top.</p>
</div>
<script src="/steward-static/plate.js"></script>
<script>
const plates = [
  {
    deliverableId: "collapse-of-marketing-jcr",
    title: "Collapse of Marketing",
    subtitle: "JCR empirical paper",
    spine: ["contribution", "method", "divergence-rate-claim", "close"],
    parts: [
      { id: "contribution", kind: "part", label: "Contribution", slot: "spine" },
      { id: "method", kind: "socket", label: "Method", slot: "spine",
        note: "heading reserved — the hole in the paper, not a to-do",
        children: [
          { id: "sample", kind: "socket", label: "Sample" },
          { id: "procedure", kind: "socket", label: "Procedure" },
          { id: "analysis", kind: "socket", label: "Analysis" }
        ] },
      { id: "divergence-rate-claim", kind: "part", label: "Divergence-rate claim", slot: "spine" },
      { id: "close", kind: "socket", label: "Close", slot: "spine" },
      { id: "figure-2", kind: "part", label: "Figure 2", slot: "hanger",
        hangsFrom: "divergence-rate-claim", jointLabel: "depends-on" },
      { id: "register", kind: "substrate", label: "Register (data object)", slot: "substrate" },
      { id: "reanalysis-engine", kind: "substrate", label: "Reanalysis engine", slot: "substrate" }
    ]
  },
  {
    deliverableId: "collapse-math-review",
    title: "Math Review",
    subtitle: "the mathematical companion",
    spine: ["audit", "survey", "digest", "paper-hole"],
    parts: [
      { id: "audit", kind: "part", label: "Mathematics audit", slot: "spine" },
      { id: "survey", kind: "part", label: "Field survey", slot: "spine" },
      { id: "digest", kind: "part", label: "Bayes-factor digest", slot: "spine" },
      { id: "paper-hole", kind: "socket", label: "Review paper", slot: "spine",
        note: "the paper itself is still a hole" },
      { id: "survey-exec", kind: "part", label: "One-page exec", slot: "hanger",
        hangsFrom: "survey", jointLabel: "constitutes" }
    ]
  }
];
let cur = plates[0].deliverableId;
function show(id) {
  const pl = plates.find(p => p.deliverableId === id) || plates[0];
  cur = pl.deliverableId;
  document.querySelector("[data-wptitle]").textContent = pl.title;
  DeliverablePlate.paintAtlas(document.querySelector("[data-wpatlas]"), plates, cur, show);
  DeliverablePlate.paintPlate(document.querySelector("[data-wpbody]"), pl);
}
show(cur);
</script>
</body></html>
