<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anchor — Split-Screen Video Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/anchor.ico" type="image/x-icon">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #111622;
    --line: #1e293b;
    --text: #e2e8f0;
    --dim: #94a3b8;
    --accent: #38bdf8;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .vp-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .vp-title-wrap {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .vp-badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 4px; background: rgba(239, 68, 68, 0.18);
    color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4);
    flex-shrink: 0;
  }
  .vp-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .vp-actions {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .vp-btn {
    font-size: 12px; font-weight: 600; padding: 5px 11px;
    border-radius: 6px; border: 1px solid var(--line);
    background: #1e293b; color: var(--text); cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  }
  .vp-btn:hover { border-color: var(--accent); color: #fff; }
  .vp-btn-close {
    background: rgba(239, 68, 68, 0.16);
    border-color: rgba(239, 68, 68, 0.45);
    color: #fecaca;
  }
  .vp-btn-close:hover {
    background: rgba(239, 68, 68, 0.28);
    border-color: #ef4444; color: #fff;
  }
  .vp-stage {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px; position: relative; min-height: 0;
  }
  .vp-frame-box {
    width: 100%; height: 100%; max-width: 1280px;
    border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: #000;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  }
  .vp-frame-box iframe {
    width: 100%; height: 100%; border: 0; display: block;
  }
  .vp-fallback {
    margin-top: 10px; font-size: 12px; color: var(--dim);
    text-align: center;
  }
  .vp-fallback a { color: var(--accent); text-decoration: underline; }
</style>
<script src="/static/app-frame.js"></script>
</head>
<body>
  <header class="vp-bar">
    <div class="vp-title-wrap">
      <span class="vp-badge">▶ YOUTUBE</span>
      <span class="vp-title" id="vpTitle">Video Player</span>
    </div>
    <div class="vp-actions">
      <a class="vp-btn" id="vpExtLink" href="#" target="_blank" rel="noopener noreferrer" title="Open video in external browser">↗ Open on YouTube</a>
      <button type="button" class="vp-btn vp-btn-close" id="vpCloseBtn" data-close-video="1" title="Close this video pane and return to Anchor">✕ Close Video</button>
    </div>
  </header>
  <main class="vp-stage">
    <div class="vp-frame-box" id="vpContainer"></div>
    <div class="vp-fallback">
      If the video owner disabled embedded playback, click <a id="vpFallbackLink" href="#" target="_blank" rel="noopener noreferrer">Open on YouTube ↗</a> or press <strong>✕ Close Video</strong> above.
    </div>
  </main>
<script>
(function () {
  var q = new URLSearchParams(location.search || "");
  var vid = (q.get("v") || "").trim();
  var rawUrl = (q.get("url") || "").trim();
  var title = (q.get("title") || "").trim();

  function parseYtId(u) {
    if (!u) return "";
    var m = String(u).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,15})/i);
    return m ? m[1] : "";
  }
  if (!vid && rawUrl) vid = parseYtId(rawUrl);
  if (!rawUrl && vid) rawUrl = "https://www.youtube.com/watch?v=" + encodeURIComponent(vid);

  var titleEl = document.getElementById("vpTitle");
  if (titleEl) {
    titleEl.textContent = title || (vid ? ("YouTube Video (" + vid + ")") : "Video Player");
    document.title = titleEl.textContent + " — Anchor";
  }
  var extA = document.getElementById("vpExtLink");
  var fbA = document.getElementById("vpFallbackLink");
  if (extA && rawUrl) extA.href = rawUrl;
  if (fbA && rawUrl) fbA.href = rawUrl;

  var box = document.getElementById("vpContainer");
  if (box && vid) {
    var ifr = document.createElement("iframe");
    ifr.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(vid) + "?autoplay=1&rel=0";
    ifr.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen");
    ifr.setAttribute("allowfullscreen", "allowfullscreen");
    box.appendChild(ifr);
  } else if (box && rawUrl) {
    var ifr2 = document.createElement("iframe");
    ifr2.src = rawUrl;
    ifr2.setAttribute("allowfullscreen", "allowfullscreen");
    box.appendChild(ifr2);
  }

  function closeVideoPane() {
    try {
      if (window.parent && window.parent !== window) {
        if (typeof window.parent.exitSecondWindowMode === "function") {
          window.parent.exitSecondWindowMode();
          return;
        }
        if (typeof window.parent.closeCaveDeliverableDrawer === "function") {
          window.parent.closeCaveDeliverableDrawer();
          return;
        }
      }
    } catch (e) {}
    try {
      if (window.top && window.top.ANCHOR_APP && typeof window.top.ANCHOR_APP.closeWindow === "function") {
        window.top.ANCHOR_APP.closeWindow(window);
        return;
      }
    } catch (e) {}
    try { window.close(); } catch (e) {}
    try { if (history.length > 1) history.back(); else location.href = "/high-seat"; } catch (e) {}
  }

  var closeBtn = document.getElementById("vpCloseBtn");
  if (closeBtn) closeBtn.addEventListener("click", closeVideoPane);
  window.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeVideoPane();
  });
})();
</script>
</body>
</html>
